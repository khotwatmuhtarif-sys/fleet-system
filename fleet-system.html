<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أسطول خطوة محترف V5</title>
<meta name="description" content="نظام متابعة فحص المركبات والمعدات الشهري - خطوة محترف">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky bilingual app header + horizontal tab bar; phone-first single-column card
   stack, responsive grids on desktop; field status captured as tri-state segmented chips
   (not checkboxes) for fast thumb entry on a job site, mirroring the paper form's check columns */
:root{
  --bg:#F3F6F2;
  --surface:#FFFFFF;
  --surface-2:#EAF0E7;
  --fg:#17211B;
  --muted:#5B6B60;
  --border:#D7E2D2;
  --accent:#2F6690;
  --accent-ink:#FFFFFF;
  --leaf:#7C9C3C;
  --leaf-ink:#FFFFFF;
  --ok:#2E8B57;
  --ok-bg:#E4F3E9;
  --warn:#B07A1C;
  --warn-bg:#FBF0DD;
  --danger:#C1402E;
  --danger-bg:#FBE8E5;
  --shadow:0 1px 2px rgba(23,33,27,.06), 0 8px 24px -16px rgba(23,33,27,.25);
  --font-display:'Cairo', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-body:'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A16; --surface:#1A2420; --surface-2:#202C26; --fg:#EAF1EB; --muted:#9BB0A2;
    --border:#2C3A33; --accent:#6FA8D8; --accent-ink:#0B1A24; --leaf:#A7C85C; --leaf-ink:#16220A;
    --ok:#53B07D; --ok-bg:#163226; --warn:#E0AC4F; --warn-bg:#352A14; --danger:#E27A68; --danger-bg:#3A1E1A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1A2420; --surface-2:#202C26; --fg:#EAF1EB; --muted:#9BB0A2;
  --border:#2C3A33; --accent:#6FA8D8; --accent-ink:#0B1A24; --leaf:#A7C85C; --leaf-ink:#16220A;
  --ok:#53B07D; --ok-bg:#163226; --warn:#E0AC4F; --warn-bg:#352A14; --danger:#E27A68; --danger-bg:#3A1E1A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font-body); direction:rtl;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:var(--font-display); text-wrap:balance}
button,input,select,textarea{font-family:inherit; color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
.container{max-width:1080px; margin:0 auto; padding-inline:16px}
.en{direction:ltr; unicode-bidi:isolate; font-size:.78em; color:var(--muted); display:block; font-weight:500; letter-spacing:.01em}
.bi-inline .en{display:inline; margin-inline-start:.4em}
.ar{display:block}
label.bi{display:block; font-weight:700; font-size:13.5px; margin-bottom:6px}

/* header */
.appbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:linear-gradient(180deg, var(--surface) 0%, var(--surface) 100%);
  border-bottom:1px solid var(--border); box-shadow:var(--shadow);
}
.appbar-inner{display:flex; align-items:center; gap:12px; padding-block:10px}
.appbar-logo{height:40px; width:auto; flex:none}
.appbar-titles{display:flex; flex-direction:column; line-height:1.25; min-width:0}
.appbar-titles b{font-family:var(--font-display); font-size:16px; font-weight:800}
.appbar-titles span.sub{font-size:11px; color:var(--muted)}
.appbar-spacer{flex:1}
.appbar-badge{font-size:11px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px 10px; white-space:nowrap}

.tabbar{display:flex; gap:4px; overflow-x:auto; padding:0 16px 10px; scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{
  flex:none; display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:7px 14px; border-radius:10px; border:1px solid transparent; background:transparent;
  cursor:pointer; font-size:13px; font-weight:700; color:var(--muted);
}
.tab .en{font-size:10px; color:inherit; opacity:.75}
.tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.tab[aria-selected="true"] .en{color:var(--accent-ink)}
.tab:hover:not([aria-selected="true"]){background:var(--surface-2); color:var(--fg)}

main{padding-block:18px 60px}

/* cards & sections */
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
.section-bar{
  display:flex; align-items:baseline; gap:8px; background:var(--accent); color:var(--accent-ink);
  border-radius:10px; padding:9px 14px; margin-bottom:12px; font-weight:800; font-family:var(--font-display);
}
.section-bar .en{color:var(--accent-ink); opacity:.85; font-size:12px}
.section-bar.leaf{background:var(--leaf); color:var(--leaf-ink)}
.section-bar.leaf .en{color:var(--leaf-ink); opacity:.85}

.grid{display:grid; gap:12px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px; background:var(--surface);
  color:var(--fg); font-size:14.5px;
}
.field textarea{min-height:64px; resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
.hint{font-size:11.5px; color:var(--muted); margin-top:4px}

/* stat tiles */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow)}
.stat .num{font-family:var(--font-display); font-size:26px; font-weight:800; font-variant-numeric:tabular-nums}
.stat .lbl{font-size:12px; color:var(--muted); font-weight:600}
.stat .lbl .en{display:block}
.stat.ok .num{color:var(--ok)} .stat.warn .num{color:var(--warn)} .stat.danger .num{color:var(--danger)}

/* badges */
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap}
.badge.ok{background:var(--ok-bg); color:var(--ok)}
.badge.warn{background:var(--warn-bg); color:var(--warn)}
.badge.danger{background:var(--danger-bg); color:var(--danger)}
.badge.neutral{background:var(--surface-2); color:var(--muted)}

/* segmented tri/bi state */
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{
  border:1.5px solid var(--border); background:var(--surface); color:var(--fg);
  border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:700; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; line-height:1.3; min-width:76px;
}
.seg button .en{font-size:9.5px; opacity:.8}
.seg button[data-active="true"][data-tone="ok"]{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.seg button[data-active="true"][data-tone="warn"]{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.seg button[data-active="true"][data-tone="danger"]{background:var(--danger-bg); border-color:var(--danger); color:var(--danger)}

/* checklist / equipment item cards */
.item-card{border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:9px; background:var(--surface-2)}
.item-head{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.item-idx{flex:none; width:24px; height:24px; border-radius:7px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums}
.item-name b{display:block; font-size:14px}
.item-name .en{font-size:11px}
.item-row{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end}
.item-row .mini{min-width:92px}
.item-row .mini label{display:block; font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:3px}
.item-row .mini input{width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:8px; background:var(--surface); font-size:13px}
.item-row .notes{flex:1 1 220px; min-width:180px}
.item-row .notes input{width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:8px; background:var(--surface); font-size:13px}
.item-remove{flex:none; border:none; background:transparent; color:var(--danger); font-size:12px; font-weight:700; cursor:pointer; padding:4px 6px}

/* photo slots */
.photos-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.photo-slot{border:1.5px dashed var(--border); border-radius:12px; padding:10px; text-align:center; background:var(--surface)}
.photo-slot b{display:block; font-size:12.5px}
.photo-slot .en{font-size:10px; margin-bottom:6px}
.photo-thumb{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; margin-bottom:6px; background:var(--surface-2)}
.photo-pdf{width:100%; aspect-ratio:4/3; border-radius:8px; margin-bottom:6px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:26px}
.photo-btn{display:inline-block; font-size:12px; font-weight:700; padding:7px 10px; border-radius:8px; border:1px solid var(--accent); color:var(--accent); background:transparent; cursor:pointer}
.photo-status{font-size:10.5px; color:var(--ok); margin-top:4px; font-weight:700}
.photo-example{width:100%;aspect-ratio:4/3;border-radius:8px;margin-bottom:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.photo-example svg{width:100%;height:100%;display:block}.photo-example .ex{font-size:9px;fill:currentColor;opacity:.62}.photo-example .ttl{font-size:10px;font-weight:700;fill:currentColor}

/* buttons */
.btn{display:inline-flex; align-items:center; gap:6px; justify-content:center; border:none; border-radius:10px; padding:11px 18px; font-size:14px; font-weight:800; cursor:pointer; font-family:var(--font-display)}
.btn .en{font-size:11px; opacity:.85}
.btn-primary{background:var(--accent); color:var(--accent-ink)}
.btn-leaf{background:var(--leaf); color:var(--leaf-ink)}
.btn-ghost{background:var(--surface-2); color:var(--fg); border:1px solid var(--border)}
.btn-outline{background:transparent; color:var(--accent); border:1.5px solid var(--accent)}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px}
.btn[disabled]{opacity:.55; cursor:not-allowed}
.btn-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}

.toast{
  position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); right:16px; left:16px; z-index:100;
  display:flex; justify-content:center; pointer-events:none;
}
.toast-msg{
  pointer-events:auto; background:var(--fg); color:var(--bg); padding:11px 18px; border-radius:12px;
  font-size:13.5px; font-weight:700; box-shadow:var(--shadow); max-width:92vw; text-align:center;
}

/* dashboard vehicle card */
.veh-card{border:1px solid var(--border); border-radius:14px; padding:14px; background:var(--surface); box-shadow:var(--shadow)}
.veh-card-top{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.veh-code{font-family:var(--font-display); font-weight:800; font-size:16px}
.veh-sub{font-size:12px; color:var(--muted)}
.veh-rows{display:flex; flex-direction:column; gap:6px; margin:10px 0; font-size:12.5px}
.veh-rows .r{display:flex; justify-content:space-between; gap:8px; align-items:center}
.veh-rows .k{color:var(--muted)}
.empty-state{text-align:center; padding:40px 16px; color:var(--muted)}
.empty-state .big{font-size:38px; margin-bottom:8px}

/* history list */
.hist-row{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--border);
  border-radius:12px; background:var(--surface); margin-bottom:8px; cursor:pointer;
}
.hist-row:hover{border-color:var(--accent)}
.hist-icon{flex:none; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--surface-2)}
.hist-main{flex:1; min-width:0}
.hist-main .t1{font-weight:700; font-size:13.5px}
.hist-main .t2{font-size:11.5px; color:var(--muted)}
.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.filters select{padding:8px 10px; border:1px solid var(--border); border-radius:9px; background:var(--surface); font-size:13px}

/* overlay detail view */
.overlay{position:fixed; inset:0; background:rgba(10,14,12,.55); z-index:200; display:flex; align-items:flex-end; justify-content:center}
@media (min-width:720px){ .overlay{align-items:center} }
.overlay-panel{
  background:var(--bg); width:100%; max-width:760px; max-height:92vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
}
@media (min-width:720px){ .overlay-panel{border-radius:18px} }
.overlay-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding-bottom:8px}
.overlay-close{flex:none; border:none; background:var(--surface-2); width:34px; height:34px; border-radius:9px; font-size:16px; cursor:pointer}
.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:10px}
.kv .kvi{background:var(--surface-2); border-radius:9px; padding:8px 10px}
.kv .kvi .k{font-size:10.5px; color:var(--muted); font-weight:700}
.kv .kvi .v{font-size:13.5px; font-weight:700}
table.rep-table{width:100%; border-collapse:collapse; font-size:12.5px}
table.rep-table th,table.rep-table td{border:1px solid var(--border); padding:6px 8px; text-align:start}
table.rep-table th{background:var(--surface-2)}
.thumb-row{display:flex; gap:8px; flex-wrap:wrap}
.thumb-row img{width:84px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border)}

.draft-note{display:flex; align-items:center; gap:10px; background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:12.5px; font-weight:700}
.draft-note button{margin-right:auto; background:none; border:1px solid var(--warn); color:var(--warn); border-radius:7px; padding:5px 9px; font-size:11.5px; cursor:pointer}

.manage-row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end}
.manage-row .field{flex:1; min-width:120px}


.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:var(--shadow)}.auth-card h2{margin:0 0 6px}.auth-card .field{margin-top:12px}.user-chip{font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:6px 10px}.users-list{display:grid;gap:8px;margin-top:12px}.user-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:10px}.user-row .meta{font-size:11px;color:var(--muted)}
@media print{ body{display:none} }
</style>
</head>

function esc(s){
  s = (s===undefined||s===null) ? "" : String(s);
  return s.replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function bi(ar,en){ return '<span class="ar">'+esc(ar)+'</span><span class="en">'+esc(en)+'</span>'; }
function biInline(ar,en){ return '<span class="bi-inline"><span class="ar">'+esc(ar)+'</span><span class="en">'+esc(en)+'</span></span>'; }
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  try{
    var d = new Date(iso.length<=10 ? iso+"T00:00:00" : iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("ar-SA-u-nu-latn",{year:"numeric",month:"2-digit",day:"2-digit"});
  }catch(e){ return iso; }
}
function daysUntil(iso){
  if(!iso) return null;
  var d = new Date(iso+"T00:00:00");
  if(isNaN(d.getTime())) return null;
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d.getTime()-now.getTime())/86400000);
}
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function on(el,ev,fn){ if(el) el.addEventListener(ev,fn); }
function uuid(){ return 'id-'+Math.random().toString(36).slice(2)+Date.now().toString(36); }

function showToast(ar,en){
  var host = qs("#toastHost");
  var el = document.createElement("div");
  el.className = "toast-msg";
  el.innerHTML = esc(ar) + (en ? ' <span class="en" style="color:inherit;opacity:.8;display:inline">'+esc(en)+'</span>' : '');
  host.innerHTML = "";
  host.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 3400);
}

function latestReportFor(code, list){
  var best=null;
  for(var i=0;i<list.length;i++){
    if(list[i].vehicleCode===code){ if(!best || (list[i].createdAt>best.createdAt)) best=list[i]; }
  }
  return best;
}
function monthCount(list){
  var now=new Date(); var ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  return list.filter(function(r){ return (r.createdAt||"").slice(0,7)===ym; }).length;
}
function expiryBadge(iso,labelAr,labelEn){
  var d = daysUntil(iso);
  var tone = "neutral", text = labelAr+": —";
  if(d===null){ text = labelAr+": —"; }
  else if(d<0){ tone="danger"; text = labelAr+": منتهي"; }
  else if(d<=30){ tone="warn"; text = labelAr+": "+d+" يوم"; }
  else { tone="ok"; text = labelAr+": "+fmtDate(iso); }
  return '<span class="badge '+tone+'">'+esc(text)+'</span>';
}
function evalBadge(code, table){
  var row = table.filter(function(r){return r[0]===code;})[0];
  if(!row) return '<span class="badge neutral">'+bi("—","—")+'</span>';
  return '<span class="badge '+row[3]+'">'+bi(row[1],row[2])+'</span>';
}

async function findNextVehicleCode(city){
  var prefix=city==="Riyadh"?"RIY":"JED", max=0;
  try{
    var snap=await state.dbns.collection("vehicles").get();
    snap.forEach(function(d){var m=String(d.id||"").match(new RegExp("^"+prefix+"-(\\d+)$"));if(m)max=Math.max(max,+m[1]);});
  }catch(e){state.vehicles.forEach(function(v){var m=String(v.code||"").match(new RegExp("^"+prefix+"-(\\d+)$"));if(m)max=Math.max(max,+m[1]);});}
  return prefix+"-"+String(max+1).padStart(2,"0");
}

function dashboardHTML(){
  if(state.currentProfile && state.currentProfile.role==="driver") return driverDashboardHTML();
  var vehicles = state.vehicles;
  var vReports = state.vReports, eReports = state.eReports;
  var maintCount = 0;
  vehicles.forEach(function(v){
    var lr = latestReportFor(v.code, vReports);
    if(lr && lr.checklist){ Object.keys(lr.checklist).forEach(function(k){ if(lr.checklist[k] && lr.checklist[k].status==="maintenance") maintCount++; }); }
    var le = latestReportFor(v.code, eReports);
    if(le && le.items){ Object.keys(le.items).forEach(function(k){ if(le.items[k] && (le.items[k].status==="not_sound" || le.items[k].status==="missing")) maintCount++; }); }
  });
  var expiringSoon = 0;
  vehicles.forEach(function(v){
    var lr = latestReportFor(v.code, vReports);
    if(lr){
      [lr.estemaraExpiry,lr.fahsExpiry,lr.insuranceExpiry].forEach(function(d){
        var n = daysUntil(d); if(n!==null && n<=30) expiringSoon++;
      });
    }
  });

  var statsHTML =
    '<div class="stats">'+
      '<div class="stat"><div class="num">'+vehicles.length+'</div><div class="lbl">'+bi("عدد المركبات","Vehicles")+'</div></div>'+
      '<div class="stat"><div class="num">'+(monthCount(vReports)+monthCount(eReports))+'</div><div class="lbl">'+bi("تقارير هذا الشهر","Reports This Month")+'</div></div>'+
      '<div class="stat '+(maintCount>0?"warn":"ok")+'"><div class="num">'+maintCount+'</div><div class="lbl">'+bi("بنود تحتاج صيانة","Items Needing Maintenance")+'</div></div>'+
      '<div class="stat '+(expiringSoon>0?"danger":"ok")+'"><div class="num">'+expiringSoon+'</div><div class="lbl">'+bi("وثائق قريبة الانتهاء","Documents Expiring Soon")+'</div></div>'+
    '</div>';

  var vehCards;
  if(!state.vehiclesLoaded){
    vehCards = '<div class="empty-state">'+bi("جارٍ تحميل المركبات…","Loading vehicles…")+'</div>';
  } else if(vehicles.length===0){

function evalFromCodeBadge(code, table){
  var row = table.filter(function(r){return r[0]===code;})[0];
  if(!row) return '<span class="badge neutral">'+bi("—","—")+'</span>';
  return '<span class="badge '+row[3]+'">'+esc(row[1])+'</span>';
}


function nextVehicleCode(city){
  var prefix=city==="Riyadh"?"RIY":"JED"; var max=0; state.vehicles.forEach(function(v){var m=String(v.code||"").match(new RegExp("^"+prefix+"-(\\d+)$")); if(m)max=Math.max(max,+m[1]);}); return prefix+"-"+String(max+1).padStart(2,"0");
}

function wireDriverVehicleManager(){
  var city=qs("#drvCity"), code=qs("#drvCode"), save=qs("#drvSaveVehicle");
  if(!city||!code||!save) return;
  var editing=save.getAttribute("data-editing")==="1";
  async function refreshCode(){if(!editing) code.value=await findNextVehicleCode(city.value);}
  refreshCode(); on(city,"change",refreshCode);
  on(save,"click",async function(){
    var c=(code.value||"").trim(); if(!c){c=await findNextVehicleCode(city.value);code.value=c;}
    var body={code:c,city:city.value,vehicleType:(qs("#drvType").value||"").trim(),plate:(qs("#drvPlate").value||"").trim(),driverName:(qs("#drvDriver").value||"").trim(),fuel:qs("#drvFuel").value||"",active:true,ownerUid:state.currentUser.uid,ownerEmail:state.currentUser.email||"",updatedAt:new Date().toISOString()};
    if(!editing)body.createdAt=new Date().toISOString(); save.disabled=true;
    try{
      if(editing){var existing=await state.dbns.collection("vehicles").doc(c).get();if(!existing.exists||(existing.data().ownerUid&&existing.data().ownerUid!==state.currentUser.uid))throw new Error("not-owner");await state.dbns.collection("vehicles").doc(c).set(body,{merge:true});}
      else{await state.dbns.collection("vehicles").doc(c).set(body);}
      state.currentProfile.vehicleCode=c; try{await state.dbns.collection("users").doc(state.currentUser.uid).update({vehicleCode:c});}catch(ignore){}
      showToast(editing?"تم حفظ تعديل المركبة":"تمت إضافة مركبتك",editing?"Vehicle changes saved":"Your vehicle was added"); renderTabbar();renderTab();
    }catch(e){showToast("تعذر حفظ بيانات المركبة","Could not save vehicle details");save.disabled=false;}
  });
}

  });});

    try{

      us.forEach(function(d){ refs.push({ref:d.ref,type:"update"}); });

  qsa(".hist-row",qs("#main")).forEach(function(row){
    on(row,"click",function(){ openDetailFromRow(row); });
  });

function confirm_(ar,en){ try{ return window.confirm(ar+" / "+en); }catch(e){ return true; } }

function uploadToCloudinary(file){
  var isPdf = (file.type === "application/pdf");
  var endpoint = "https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD_NAME+"/"+(isPdf?"auto":"image")+"/upload";
  var fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  return fetch(endpoint, {method:"POST", body:fd}).then(function(resp){
    if(!resp.ok) throw new Error("upload_failed");
    return resp.json();
  }).then(function(data){
    return {
      id: data.public_id,
      url: data.secure_url,
      contentType: isPdf ? "application/pdf" : ("image/"+(data.format||"jpg"))
    };
  });
}

async function handlePhotoUpload(prefix, slotId, file, draft, saver){
  var statusEl = qs('[data-photostatus="'+prefix+'-'+slotId+'"]');
  var slotEl = qs('.photo-slot[data-slot="'+slotId+'"]');
  if(!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME.indexOf("YOUR_")===0){
    showToast("يجب ضبط إعدادات رفع الصور (Cloudinary) أولًا","Photo upload is not configured yet (set Cloudinary settings)");
    return;
  }
  if(statusEl) statusEl.textContent = "جارٍ الرفع… Uploading…";
  try{
    var res = await uploadToCloudinary(file);
    draft.photos[slotId] = {id:res.id, url:res.url, contentType:res.contentType};
    saver();
    if(slotEl){
      var preview = slotEl.querySelector(".photo-thumb,.photo-pdf,.photo-example");
      if(preview){
        if(res.contentType==="application/pdf"){
          var pdfDiv = document.createElement("div"); pdfDiv.className="photo-pdf"; pdfDiv.textContent="📄";
          preview.replaceWith(pdfDiv);
        } else {
          var img = document.createElement("img"); img.className="photo-thumb"; img.src=res.url; img.alt="";
          preview.replaceWith(img);
        }
      }
      var btn = slotEl.querySelector(".photo-btn");
      if(btn) btn.innerHTML = bi("تغيير","Change") + btn.querySelector("input").outerHTML;
    }
    if(statusEl) statusEl.textContent = "✓ تم الرفع";
  }catch(e){
    if(statusEl) statusEl.textContent = "";
    showToast("فشل رفع الصورة، حاول مجددًا","Photo upload failed, try again");
  }
}

async function submitVehicleReport(){
  syncDriverVehicleDrafts();
  var d = vehicleDraft;
  var code = (d.vehicleCode||"").trim();
  code = (code||"").trim();
  if(!code){ showToast("يرجى اختيار كود المركبة","Please select a vehicle code"); return; }
  if(!d.inspectionDate){ showToast("يرجى تحديد تاريخ الفحص","Please set the inspection date"); return; }
  var tireStatus=(d.checklist.tires||{}).status, dentsStatus=(d.checklist.dents||{}).status, interiorStatus=(d.checklist.interior||{}).status;
  if(!d.photos.tirespare || !d.photos.tirespare.id){ showToast("صورة الكفر الاحتياطي مطلوبة","Spare tire photo is required"); return; }
  if((tireStatus==="followup"||tireStatus==="maintenance") && (!d.tireProblem || !d.photos.tires || !d.photos.tires.id)){ showToast("حدد الكفر المتضرر وارفع صورته","Select the affected tire and upload its photo"); return; }
  if((dentsStatus==="followup"||dentsStatus==="maintenance") && (!d.photos.dents||!d.photos.dents.id)){ showToast("ارفع صورة الصدمات أو الخدوش","Upload a photo of dents/scratches"); return; }
  if((interiorStatus==="followup"||interiorStatus==="maintenance") && (!d.photos.interior||!d.photos.interior.id)){ showToast("ارفع صورة الحالة الداخلية","Upload an interior photo"); return; }
  if(!state.dbns){ showToast("قاعدة البيانات غير متاحة حاليًا","Database unavailable right now"); return; }

  var btn = qs("#vSubmit"); if(btn){ btn.disabled = true; btn.textContent = "جارٍ الإرسال… Sending…"; }
  var photos = {};
  Object.keys(d.photos).forEach(function(k){ if(d.photos[k] && d.photos[k].id) photos[k] = {id:d.photos[k].id, url:d.photos[k].url||"", contentType:d.photos[k].contentType||""}; });

  var payload = {
    vehicleCode: code, city:d.city||"", vehicleType:d.vehicleType||"", plate:d.plate||"", fuel:d.fuel||"",
    driverName:d.driverName||"", inspectionDate:d.inspectionDate, odometer:d.odometer||"",
    oilLastDate:d.oilLastDate||"", oilLastOdometer:d.oilLastOdometer||"", airFilterDate:d.airFilterDate||"", oilFilterDate:d.oilFilterDate||"", tireProblem:d.tireProblem||"",
    estemaraExpiry:d.estemaraExpiry||"", fahsExpiry:d.fahsExpiry||"", insuranceExpiry:d.insuranceExpiry||"",
    checklist: d.checklist, photos: photos,
    evaluation:d.evaluation||"", faults:d.faults||"", requiredAction:d.requiredAction||"",
    supervisorName:d.supervisorName||"", driverName2:d.driverName2||"", nextFollowup:d.nextFollowup||"",
    createdAt: new Date().toISOString(), createdBy: state.myId
  };
  try{
    await state.dbns.collection("vehicle_reports").add(payload);
    showToast("تم إرسال التقرير بنجاح","Report submitted successfully");
    vehicleDraft = freshVehicleDraft(); vehicleDraftRestored=false; safeLocalDel("ps_vehicle_draft_v1");
    state.tab="dashboard"; location.hash="dashboard"; renderTabbar(); renderTab();
  }catch(e){
    showToast("تعذر إرسال التقرير، حاول مجددًا","Could not submit report, try again");
    if(btn){ btn.disabled=false; btn.innerHTML = bi("إرسال التقرير","Submit Report"); }
  }
}

async function submitEquipmentReport(){
  syncDriverVehicleDrafts();
  var d = equipmentDraft;
  var code = (d.vehicleCode||"").trim();
  code = (code||"").trim();
  if(!code){ showToast("يرجى اختيار كود المركبة","Please select a vehicle code"); return; }
  if(!d.date){ showToast("يرجى تحديد التاريخ","Please set the date"); return; }
  for(var ei=0;ei<EQUIPMENT_ITEMS.length;ei++){ var eid=EQUIPMENT_ITEMS[ei][0], item=d.items[eid]||{}; if(!item.status){ showToast("حدد حالة جميع المعدات","Select a status for every equipment item"); return; } if(item.status!=="missing" && (!d.photos[eid]||!d.photos[eid].id)){ showToast("صورة كل معدة موجودة مطلوبة","A photo is required for every equipment item that is present"); return; } if(item.status!=="missing" && (item.qty===""||Number(item.qty)<1)){ showToast("أدخل العدد لكل معدة موجودة","Enter quantity for every equipment item that is present"); return; } }
  if(!state.dbns){ showToast("قاعدة البيانات غير متاحة حاليًا","Database unavailable right now"); return; }

  var btn = qs("#eSubmit"); if(btn){ btn.disabled = true; btn.textContent = "جارٍ الإرسال… Sending…"; }
  var payload = {
    vehicleCode: code, plate:d.plate||"", city:d.city||"", driverTech:d.driverTech||"",
    supervisorName:d.supervisorName||"", date:d.date, odometer:d.odometer||"",
    items: d.items, extraItems: d.extraItems||[], photos:d.photos||{}, readiness: d.readiness,
    missingNotes:d.missingNotes||"", maintenanceNotes:d.maintenanceNotes||"", requiredAction:d.requiredAction||"",
    finalEvaluation:d.finalEvaluation||"", technicianName:d.technicianName||"",
    createdAt: new Date().toISOString(), createdBy: state.myId
  };
  try{
    await state.dbns.collection("equipment_reports").add(payload);
    showToast("تم إرسال التقرير بنجاح","Report submitted successfully");
    equipmentDraft = freshEquipmentDraft(); equipmentDraftRestored=false; safeLocalDel("ps_equipment_draft_v1");
    state.tab="dashboard"; location.hash="dashboard"; renderTabbar(); renderTab();
  }catch(e){
    showToast("تعذر إرسال التقرير، حاول مجددًا","Could not submit report, try again");
    if(btn){ btn.disabled=false; btn.innerHTML = bi("إرسال التقرير","Submit Report"); }
  }
}

/* ========================================================================
   EXPORTS: CSV (Excel) + PDF (via off-screen print sheet -> html2canvas -> jsPDF)
   ======================================================================== */
function csvEscape(v){
  v = (v===undefined||v===null) ? "" : String(v);
  if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function toCSV(rows){
  return "﻿" + rows.map(function(row){ return row.map(csvEscape).join(","); }).join("\r\n");
}

function saveFile(filename, blobOrStr, mime){
  try{
    var data = blobOrStr;
    if(typeof blobOrStr === "string"){ data = new Blob([blobOrStr], {type:mime||"text/plain"}); }
    var url = URL.createObjectURL(data);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1500);
    showToast("تم الحفظ","Saved");
  }catch(e){
    showToast("تعذر إنشاء الملف","Could not create the file");
  }
}

function exportReportCSV(type, r, submitter){
  var rows = [];
  rows.push(["كود المركبة / Vehicle Code", r.vehicleCode||""]);
  rows.push(["التاريخ / Date", type==="vehicle"?r.inspectionDate:r.date]);
  rows.push(["المشرف / Supervisor", r.supervisorName||""]);
  rows.push(["أُرسل بواسطة / Submitted By", submitter||""]);
  rows.push([]);
  if(type==="vehicle"){
    rows.push(["البند / Item","الحالة / Status","ملاحظات / Notes"]);
    VEHICLE_CHECK_ITEMS.forEach(function(it){
      var c=(r.checklist||{})[it[0]]||{};
      var tone = TRI_CHECK.filter(function(t){return t[0]===c.status;})[0];
      rows.push([it[1]+" / "+it[2], tone?tone[1]+" / "+tone[2]:"", c.notes||""]);
    });
    rows.push([]);
    rows.push(["انتهاء الاستمارة / Registration Exp.", r.estemaraExpiry||""]);
    rows.push(["انتهاء التأمين / Insurance Exp.", r.insuranceExpiry||""]);
    rows.push(["انتهاء الفحص / Inspection Exp.", r.fahsExpiry||""]);
    var ev = VEHICLE_EVAL.filter(function(e){return e[0]===r.evaluation;})[0];
    rows.push(["التقييم العام / Overall Evaluation", ev?ev[1]+" / "+ev[2]:""]);
    rows.push(["الأعطال / الملاحظات", r.faults||""]);
    rows.push(["الإجراء المطلوب / Required Action", r.requiredAction||""]);
  } else {
    rows.push(["المعدة / Equipment","العدد / Quantity","الحالة / Status","ملاحظات / Notes"]);
    EQUIPMENT_ITEMS.forEach(function(it){ var c=(r.items||{})[it[0]]||{}; var st=EQUIP_STATUS.filter(function(t){return t[0]===c.status;})[0]; rows.push([it[1]+" / "+it[2],c.qty||"",st?st[1]+" / "+st[2]:"",c.notes||""]); });
    (r.extraItems||[]).forEach(function(c){ var st=EQUIP_STATUS.filter(function(t){return t[0]===c.status;})[0]; rows.push([c.name||"",c.qty||"",st?st[1]+" / "+st[2]:"",c.notes||""]); });
    rows.push([]);
    rows.push(["البند / Readiness Item","الحالة / Status"]);
    READINESS_ITEMS.forEach(function(it){
      var v=(r.readiness||{})[it[0]];
      var rt=READY3.filter(function(t){return t[0]===v;})[0];
      rows.push([it[1]+" / "+it[2], rt?rt[1]+"/"+rt[2]:""]);
    });
    var ev = EQUIP_EVAL.filter(function(e){return e[0]===r.finalEvaluation;})[0];
    rows.push([]);
    rows.push(["التقييم النهائي / Final Evaluation", ev?ev[1]+" / "+ev[2]:""]);
    rows.push(["المعدات الناقصة / Missing", r.missingNotes||""]);
    rows.push(["تحتاج صيانة / Needs Maintenance", r.maintenanceNotes||""]);
    rows.push(["الإجراء المطلوب / Required Action", r.requiredAction||""]);
  }
  var csv = toCSV(rows);
  var fname = (type==="vehicle"?"vehicle-report-":"equipment-report-")+(r.vehicleCode||"x")+"-"+(type==="vehicle"?r.inspectionDate:r.date)+".csv";
  saveFile(fname, csv, "text/csv");
}

async function exportReportPDF(type, r, submitter){
  if(!window.html2canvas || !window.jspdf){
    showToast("تعذر تحميل أداة PDF، حاول لاحقًا","PDF tool failed to load, try again later");
    return;
  }
  showToast("جارٍ إنشاء ملف PDF…","Generating PDF…");
  var sheet = buildPrintSheet(type, r, submitter);
  try{
    var canvas = await window.html2canvas(sheet, {scale:2, backgroundColor:"#ffffff", useCORS:true});
    var jsPDFCtor = window.jspdf.jsPDF;
    var pdf = new jsPDFCtor({unit:"pt", format:"a4"});
    var pageW = pdf.internal.pageSize.getWidth();
    var pageH = pdf.internal.pageSize.getHeight();
    var imgW = pageW;
    var imgH = canvas.height * (imgW / canvas.width);
    var heightLeft = imgH, position = 0, first = true;
    var pageCanvasH = pageH * (canvas.width / imgW);
    while(heightLeft > 0){
      var sliceH = Math.min(pageCanvasH, canvas.width>0 ? (canvas.height - position*(canvas.width/imgW)) : 0);
      var sliceCanvas = document.createElement("canvas");
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = Math.min(pageCanvasH, canvas.height - (canvas.height - heightLeft*(canvas.width/imgW)));
      var srcY = canvas.height - heightLeft*(canvas.width/imgW);
      sliceCanvas.height = Math.min(pageCanvasH, canvas.height - srcY);
      var ctx = sliceCanvas.getContext("2d");
      ctx.drawImage(canvas, 0, srcY, canvas.width, sliceCanvas.height, 0, 0, canvas.width, sliceCanvas.height);
      var sliceImgH = sliceCanvas.height * (imgW / canvas.width);
      if(!first) pdf.addPage();
      pdf.addImage(sliceCanvas.toDataURL("image/jpeg",0.92), "JPEG", 0, 0, imgW, sliceImgH);
      heightLeft -= sliceImgH;
      first = false;
    }
    var blob = pdf.output("blob");
    var fname = (type==="vehicle"?"vehicle-report-":"equipment-report-")+(r.vehicleCode||"x")+"-"+(type==="vehicle"?r.inspectionDate:r.date)+".pdf";
    await saveFile(fname, blob);
  }catch(e){
    showToast("تعذر إنشاء ملف PDF","Could not generate the PDF");
  }finally{
    sheet.remove();
  }
}

    else {state.vehicles=[];state.vehiclesLoaded=true;renderTab();}
  } else state.dbns.collection("vehicles").onSnapshot(function(snap){
    var all=snap.docs.map(function(d){var b=d.data()||{};b.code=d.id;return b;}).filter(function(v){return v.active!==false;});
    var p=state.currentProfile||{}; if(p.role==="supervisor"&&p.city&&p.city!=="all") all=all.filter(function(v){return v.city===p.city;});
    state.vehicles=all.sort(function(a,b){return (a.code||"").localeCompare(b.code||"");}); state.vehiclesLoaded=true; if(state.tab==="dashboard"||state.tab==="history"||state.tab==="users")renderTab(); else refreshCodeSelectsOnly();
  });
  state.dbns.collection("vehicle_reports").orderBy("createdAt","desc").limit(200).onSnapshot(function(snap){var all=snap.docs.map(function(d){var b=d.data()||{};b.id=d.id;return b;});var p=state.currentProfile||{};if(p.role==="driver")all=p.vehicleCode?all.filter(function(r){return r.vehicleCode===p.vehicleCode;}):[];state.vReports=all;state.reportsLoaded=true;if(state.tab==="dashboard"||state.tab==="history")renderTab();});
  state.dbns.collection("equipment_reports").orderBy("createdAt","desc").limit(200).onSnapshot(function(snap){var all=snap.docs.map(function(d){var b=d.data()||{};b.id=d.id;return b;});var p=state.currentProfile||{};if(p.role==="driver")all=p.vehicleCode?all.filter(function(r){return r.vehicleCode===p.vehicleCode;}):[];state.eReports=all;if(state.tab==="dashboard"||state.tab==="history")renderTab();});
  if(state.currentProfile.role==="admin") state.dbns.collection("users").onSnapshot(function(snap){state.users=snap.docs.map(function(d){var b=d.data()||{};b.id=d.id;return b;});if(state.tab==="users")renderTab();});
  state.dbns.collection("app_config").doc("fleet_app").onSnapshot(function(doc){
    state.appUpdate=doc.exists?(doc.data()||{}):null;
    var ver=state.appUpdate&&state.appUpdate.version, seen=safeLocalGet("ps_seen_app_version");
    var ub=qs("#updateBtn");
    if(ub){
      if(ver && ver!==seen && state.currentProfile && state.currentProfile.role!=="admin"){
        ub.hidden=false;
        ub.onclick=function(){ safeLocalSet("ps_seen_app_version",ver); var u=new URL(location.href); u.searchParams.set("v",Date.now()); location.href=u.toString(); };
      } else ub.hidden=true;
    }
    if(state.tab==="users" && state.currentProfile && state.currentProfile.role==="admin") renderTab();
  });
}

/* ========================================================================
   DATA INIT: capabilities + subscriptions
   ======================================================================== */
function initCapabilities(){
  try{
    if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("YOUR_")===0){
      state.dbns = null;
    } else {
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
      state.dbns = firebase.firestore();
    }
  }catch(e){ state.dbns = null; }
  state.assetsns = null; state.downloadsns = null; state.userns = null; state.myId = null;
  if(!state.dbns){ renderShell(); var badge=qs("#connBadge"); if(badge) badge.innerHTML=bi("غير متصل","Offline"); return; }
  state.auth=firebase.auth();
  state.auth.onAuthStateChanged(function(user){
    state.currentUser=user||null; state.currentProfile=null; state.users=[];
    if(!user){ showLogin(); return; }
    state.myId=user.uid; subscribeForProfile();
  });
}

function refreshCodeSelectsOnly(){
  var vSel = qs("#vCode"), eSel = qs("#eCode");
  if(vSel){ var cur=vehicleDraft.vehicleCode; vSel.innerHTML = vehicleCodeOptions(cur); }
  if(eSel){ var cur2=equipmentDraft.vehicleCode; eSel.innerHTML = vehicleCodeOptions(cur2); }
}

/* ========================================================================
   BOOT
   ======================================================================== */
function boot(){
  var hash = (location.hash||"").replace("#","");
  if(TABS.some(function(t){return t[0]===hash;})) state.tab = hash;
  qs("#app").innerHTML='<div class="auth-wrap"><div class="auth-card">جارٍ التحميل…</div></div>';
  initCapabilities();
}
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", boot); } else { boot(); }

})();

</script>
